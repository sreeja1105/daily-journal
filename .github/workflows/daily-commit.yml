name: Daily Auto Commit

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update daily log
        run: |
          DATE=$(date -u "+%Y-%m-%d")
          DAY_OF_WEEK=$(date -u "+%A")
          WEEK=$(date -u "+%V")
          {
            echo ""
            echo "## ${DATE} (${DAY_OF_WEEK})"
            echo "- Week ${WEEK} of the year"
            echo "- Continuing daily learning and building"
          } >> journal.md
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal.md
          git diff --staged --quiet || git commit -m "Daily entry: $(date -u +%Y-%m-%d)"
          git push
